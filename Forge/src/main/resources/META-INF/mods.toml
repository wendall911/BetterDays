modLoader="javafml"
loaderVersion="${forge_version_range}"
license="${license}"
issueTrackerURL="https://github.com/${mod_author}/${mod_name}/issues"
#clientSideOnly=true #optional

[[mods]]
    modId="${mod_id}"
    version="${version}"
    displayName="${mod_name}"
    updateJSONURL="https://raw.githubusercontent.com/${mod_author}/${mod_name}/${mod_update_branch}/files/updates.json"
    displayURL="https://github.com/${mod_author}/${mod_name}"
    authors="${mod_author}"
    credits="${mod_credits}"
    description='''
    ${mod_description}
    '''
[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"
[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${forge_mc_version_range}"
    ordering="NONE"
    side="BOTH"
[[dependencies.${mod_id}]]
    modId="whitenoise"
    mandatory=true
    versionRange="${whitenoise_range}"
    ordering="NONE"
    side="BOTH"
