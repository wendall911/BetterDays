plugins {
    id 'java'
    id 'idea'
    id 'org.spongepowered.gradle.vanilla'
}

archivesBaseName = "${mod_id}-common"

minecraft {
    version(minecraft_version)
    if (file("src/main/resources/${mod_id}.accesswidener").exists()){
        accessWideners(file("src/main/resources/${mod_id}.accesswidener"))
    }
}

dependencies {
    compileOnly group: 'org.spongepowered', name: 'mixin', version: "${mixin_version}"
    implementation group: 'com.google.code.findbugs', name: 'jsr305', version: '3.0.1'
    implementation group: 'technology.roughness.whitenoise', name: "whitenoise-${minecraft_version}-common", version: "${whitenoise_version}"
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
}

def replaceProperties = [
    'mod_display_name': mod_display_name,
    'pack_format': pack_format
]

processResources {
    filesMatching("pack.mcmeta") {
        expand replaceProperties
    }
}
