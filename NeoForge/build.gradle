plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
    id 'io.github.goooler.shadow'
    id 'se.bjurr.gitchangelog.git-changelog-gradle-plugin'
}

archivesBaseName = "${mod_id}"
version = neoforge_mod_version

neoForge {
    version = neoforge_version
    parchment {
        minecraftVersion = minecraft_version
        mappingsVersion = mappings_version
    }
    runs {
        configureEach {
            systemProperty('neoforge.enabledGameTestNamespaces', mod_id)
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})" // Unify the run config names with fabric
        }
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    implementation group: 'technology.roughness.whitenoise', name: 'whitenoise-neoforge', version: "${whitenoise_version}"
    jarJar group: 'technology.roughness.whitenoise', name: 'whitenoise-neoforge', version: "${whitenoise_version}"

    // Testing mods
    //runtimeOnly "curse.maven:configured-457570:4462837"
    //runtimeOnly "curse.maven:catalogue-459701:4590890"
    // Built for localmaven to test until they have a release
    //runtimeOnly 'com.aetherteam.aether:aether:1.21.1-1.5.0-neoforge'
    //runtimeOnly "curse.maven:aether-255308:${aether_neoforge_version}"
    // Extremely annoying and strangely popular mod library that disabled doDaylightCycle on new worlds by default
    //runtimeOnly "curse.maven:owo-532610:${owo_neoforge_version}"
}

shadowJar {
    archiveClassifier = ''
}

tasks.register('idePostSync') {}

task changelog(type: se.bjurr.gitchangelog.plugin.gradle.GitChangelogTask) {
    file.set(new File(project(":").projectDir.toString() + '/build/libs/changelog.txt'));
    templateContent.set(file(project(":").projectDir.toString() + '/files/templates/changelog.mustache').getText('UTF-8'));
    toRevision.set('HEAD');
    fromRevision.set("${minecraft_version}-${last_mod_version}");
}

def updates = tasks.register("generateUpdates", Copy) {
    it.outputs.upToDateWhen {
        false
    }

    it.from("../files/templates/") {
        include 'updates.json'
        expand 'version': version, 'minecraft_version': minecraft_version
    }

    it.into '../files/'
}

tasks.generateUpdates.mustRunAfter('jar', 'sourcesJar')

tasks.build.dependsOn('changelog', 'generateUpdates')

def changelogFile = project(":").projectDir.toString() + '/build/libs/changelog.txt'
def publishFile = project(":").projectDir.toString() + "/NeoForge/build/libs/${archivesBaseName}-${version}.jar"

publishMods {
    file = file(publishFile)
    if (file(changelogFile).exists()) {
        changelog = file(changelogFile).text
    }
    type = "${release_type}".startsWith("release") ? STABLE : ("${release_type}".startsWith("beta") ? BETA : ALPHA)
    modLoaders.add('neoforge')
    dryRun = providers.environmentVariable('DO_RELEASE').getOrNull() == null

    if (project.hasProperty('bdcurseApiKey')) {
        curseforge {
            accessToken = project.bdcurseApiKey
            projectId = project.bdcurseId
            javaVersions.add(JavaVersion.toVersion("${java_version}"))
            clientRequired = true
            serverRequired = true
            minecraftVersions.addAll("${release_versions}".split(','))
            embeds('spectrelib')
            optional('configured')
            optional('catalogue')
            optional('serene-seasons')
            optional('ecliptic-seasons')
            optional('comforts')
            incompatible('immersive-snow')
        }
    }
    if (project.hasProperty('bdModrinthId')) {
        modrinth {
            accessToken = project.modrinthKey
            projectId = project.bdModrinthId
            minecraftVersions.addAll("${release_versions}".split(','))
            optional('serene-seasons')
            optional('comforts')
            incompatible('immersive-snow')
        }
    }
}
